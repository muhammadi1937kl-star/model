<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Марафон Успеха — Онлайн Платформа и Аналитика</title>

    <meta property="og:title" content="Марафон Успеха — Онлайн Платформа и Аналитика">
    <meta property="og:description" content="Веб-приложение и аналитический дашборд марафона личной эффективности с синхронизацией базы данных Google Sheets.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0F172A;
            --surface: #1E293B;
            --surface-dark: #151E2E;
            --surface-variant: #334155;
            --border: #334155;
            --border-light: #475569;
            --cyan: #00D2FF;
            --blue: #3A86FF;
            --gold: #FFB703;
            --amber: #FB8500;
            --emerald: #10B981;
            --pink: #F72585;
            --purple: #8338EC;
            --text-white: #F8FAFC;
            --text-muted: #94A3B8;
            --text-dark: #0A1128;
            --danger: #EF4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }

        /* Responsive Layout for Mobile & PC Desktop */
        #app-container {
            width: 100%;
            max-width: 1240px;
            background-color: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 85px;
        }

        /* Top Header */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 24px;
            background-color: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .avatar-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background: linear-gradient(135deg, rgba(0,210,255,0.3), var(--surface-variant));
            border: 2px solid var(--cyan);
            color: var(--cyan);
            flex-shrink: 0;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-weight: 800;
            font-size: 15px;
            color: var(--text-white);
        }

        .role-tag {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            margin-top: 2px;
        }

        .role-mentor {
            background: rgba(255, 183, 3, 0.18);
            color: var(--gold);
        }

        .role-student {
            background: rgba(0, 210, 255, 0.18);
            color: var(--cyan);
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .notification-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--surface);
            border: 1px solid var(--border-light);
            padding: 8px 14px;
            border-radius: 12px;
            cursor: pointer;
            color: var(--cyan);
            font-weight: 700;
            font-size: 13px;
            transition: 0.2s;
            white-space: nowrap;
        }

        .notification-btn:hover {
            border-color: var(--cyan);
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 1240px;
            height: 65px;
            background-color: var(--surface);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border-light);
            z-index: 1000;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.45);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 11px;
            transition: 0.2s;
            flex: 1;
            padding: 8px 0;
            user-select: none;
        }

        .nav-item i {

        }

        .nav-item.active {
            color: var(--cyan);
            font-weight: 700;
        }

        /* Main Content Area */
        .content {
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;

        @media (max-width: 640px) {
            .content { padding: 14px 14px; gap: 14px; }
            .top-bar { padding: 12px 14px; }
        }

        /* Responsive Grids */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }

        @media (min-width: 640px) {
            .grid-2 { grid-template-columns: 1fr 1fr; }
            .grid-4 { grid-template-columns: 1fr 1fr; }
        }

        @media (min-width: 960px) {
            .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
            .grid-4 { grid-template-columns: repeat(4, 1fr); }
            .analytics-charts-grid {
                display: grid;
                grid-template-columns: 7fr 5fr;
                gap: 18px;
                align-items: stretch;
            }

        /* Cards & Buttons */
        .card {
            background-color: var(--surface);
            border-radius: 18px;
            padding: 20px;
            border: 1px solid var(--border);
            transition: 0.2s;
        }

        .card-gold {
            background: linear-gradient(135deg, rgba(38,25,4,1) 0%, var(--surface) 100%);
            border-color: rgba(255, 183, 3, 0.65);
        }

        .btn {
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid transparent;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.18s;
            white-space: nowrap;

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-cyan { background-color: var(--cyan); color: var(--text-dark); }
        .btn-cyan:hover { filter: brightness(1.08); }
        .btn-gold { background-color: var(--gold); color: var(--text-dark); }
        .btn-emerald { background-color: rgba(16, 185, 129, 0.18); color: var(--emerald); border-color: rgba(16, 185, 129, 0.4); }
        .btn-emerald:hover { background-color: rgba(16, 185, 129, 0.28); }
        .btn-surface { background-color: var(--surface-variant); color: var(--text-white); border-color: var(--border-light); }
        .btn-surface:hover { border-color: var(--cyan); }
        .btn-danger { background-color: var(--danger); color: var(--text-white); }
        .btn-sm { padding: 6px 11px; font-size: 12px; border-radius: 9px; }
        .btn-full { width: 100%; }

        /* Donut Chart */
        .donut-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .donut-svg-wrap {

            width: 170px;
            height: 170px;
        }

        .donut-svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .donut-center {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

        .donut-percent {
            font-size: 28px;
            font-weight: 800;
        }

        .donut-label {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Quick Actions Grid */
        .quick-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (min-width: 768px) {
            .quick-grid { grid-template-columns: repeat(4, 1fr); }

        .quick-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: 0.2s;

        .quick-card:hover {
            border-color: var(--cyan);
            transform: translateY(-2px);
        }

        .quick-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        /* Forms & Inputs */
        .task-input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--surface);
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid var(--border);
        }

        .checkbox {
            width: 22px;
            height: 22px;
            accent-color: var(--cyan);
            cursor: pointer;
        }

        input[type="text"], input[type="password"], input[type="number"], input[type="date"], textarea, select {
            width: 100%;
            padding: 11px 14px;
            background-color: var(--surface-variant);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            color: var(--text-white);
            font-size: 13px;
            outline: none;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--cyan);
        }

        /* Filter Chips Bar */
        .filter-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            white-space: nowrap;
            align-items: center;
        }

        .filter-chip {
            padding: 8px 15px;
            border-radius: 11px;
            background-color: var(--surface-dark);
            border: 1px solid var(--border-light);
            color: var(--text-white);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.18s;
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .filter-chip:hover {
            border-color: var(--cyan);
        }

        .filter-chip.active {
            background-color: var(--cyan);
            border-color: var(--cyan);
            color: var(--text-dark);
            font-weight: 800;
        }

        /* Data Table Styles for Analytics Dashboard */
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            border-radius: 14px;
            border: 1px solid var(--border);
            background-color: var(--surface-dark);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: left;
        }

        .data-table th {
            background-color: rgba(15, 23, 42, 0.9);
            color: var(--text-muted);
            font-weight: 700;
            padding: 12px 10px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            user-select: none;
        }

        .data-table th.sortable {
            cursor: pointer;
        }

        .data-table th.sortable:hover {
            color: var(--cyan);
        }

        .data-table td {
            padding: 11px 10px;
            border-bottom: 1px solid rgba(51, 65, 85, 0.55);
            vertical-align: middle;
        }

        .data-table tbody tr:hover {
            background-color: rgba(51, 65, 85, 0.35);
        }

        .data-table tfoot td {
            background-color: rgba(15, 23, 42, 0.95);
            font-weight: 800;
            padding: 12px 10px;
            border-top: 2px solid var(--border-light);
        }

        .badge-yes {
            color: var(--emerald);
            font-weight: 800;
        }

        .badge-no {
            color: #64748B;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background-color: #0F172A;
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 99px;
            transition: width 0.3s ease;
        }

        /* Chat UI */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 230px);
            min-height: 440px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 14px;
            background-color: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            border-radius: 16px;
        }

        .chat-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.45;
            word-break: break-word;
        }

        .chat-mine {
            align-self: flex-end;
            background-color: rgba(0, 210, 255, 0.18);
            border: 1px solid rgba(0, 210, 255, 0.45);
            border-bottom-right-radius: 4px;
        }

        .chat-other {
            align-self: flex-start;
            background-color: var(--surface);
            border: 1px solid var(--border-light);
            border-bottom-left-radius: 4px;
        }

        .chat-broadcast {
            align-self: center;
            width: 100%;
            max-width: 100%;
            background-color: rgba(255, 183, 3, 0.12);
            border: 1px solid rgba(255, 183, 3, 0.45);
        }

        .chat-sender {
            font-size: 11px;
            font-weight: 700;
            color: var(--cyan);
            margin-bottom: 4px;
        }

        .chat-time {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
            text-align: right;
        }

        .chat-input-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            padding-top: 12px;
        }

        /* Modals & Toast */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.78);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow-y: auto;
        }

        .modal-content {
            background-color: var(--surface);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 540px;
            border: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .toast-box {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 4000;
            background-color: #064E3B;
            border: 1px solid var(--emerald);
            color: #F8FAFC;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: 0.25s;
        }

        /* Login Screen */
        .login-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: var(--bg-dark);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            background-color: var(--surface);
            border-radius: 24px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* Breathing Circle */
        .breath-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 4px solid var(--cyan);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 16px auto;
            transition: transform 0.8s ease, border-color 0.4s ease;
            background: rgba(15, 23, 42, 0.7);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="toast-container" class="toast-box hidden"></div>

<div id="app-container">
    <!-- Top Header Bar -->
    <div class="top-bar">
        <div class="user-badge" onclick="switchTab('profile')">
            <div class="avatar-circle" id="top-avatar">
                <i class="fa-solid fa-user"></i>

                <span class="user-name" id="top-user-name">Загрузка...</span>

                    <span class="role-tag role-mentor" id="top-user-role">Роль</span>
                </div>
            </div>
        </div>

        <div class="top-actions">
            <button class="notification-btn" onclick="syncAllData(true)" title="Быстрая синхронизация с Google Sheets">
                <i class="fa-solid fa-rotate" id="sync-icon"></i>
                <span id="sync-latency-label" class="tabular-nums" style="font-size:11px; color:var(--text-muted);">БД</span>
            </button>
            <div class="notification-btn" onclick="switchTab('history')" title="Перейти к истории отчетов">

    <!-- Main Content Body -->

    <div class="bottom-nav" id="bottom-nav"></div>

<!-- Login Screen -->
<div class="login-screen hidden" id="login-screen">
    <div class="login-card">
        <div style="text-align: center;">
            <i class="fa-solid fa-trophy" style="font-size: 48px; color: var(--gold); margin-bottom: 12px;"></i>
            <h2 style="font-size: 24px; font-weight: 800;">Марафон Успеха</h2>
            <p style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">Онлайн база данных Google Sheets</p>
        </div>

        <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 10px;">
            <div>
                <label style="font-size: 12px; color: var(--text-muted); margin-bottom: 4px; display: block;">Логин</label>
                <input type="text" id="login-username" placeholder="Введите ваш логин" onkeydown="if(event.key==='Enter') handleLogin()">

            <div>
                <label style="font-size: 12px; color: var(--text-muted); margin-bottom: 4px; display: block;">Пароль</label>
                <input type="password" id="login-password" placeholder="Введите пароль" onkeydown="if(event.key==='Enter') handleLogin()">
            </div>
            <button class="btn btn-cyan btn-full" style="padding: 14px; font-size: 15px; margin-top: 6px;" onclick="handleLogin()" id="login-btn">Войти в марафон</button>
        </div>
    </div>
</div>

<!-- Modal Container -->
<div class="modal-overlay hidden" id="modal-container" onclick="if(event.target===this) closeModal()">
    <div class="modal-content" id="modal-body"></div>
</div>

<script>
    // ============================================================================
    // КОНФИГУРАЦИЯ БАЗЫ ДАННЫХ GOOGLE APPS SCRIPT
    // ============================================================================
    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxH_ahjT5hIPL9QwYAM5m1XKSy25nAkq44A7uxB6BpeojePRXVjGdln-qFHtRqgXErK/exec";

    // Исправленный массив месяцев (устраняет критический баг ReferenceError: monthsRu is not defined)
    const monthsRu = ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'];

    const TASK_NAMES = {
        ALL: 'Общий прогресс (9 задач)',
        t1: '1. Физ. нагрузки (мин)',
        t2: '2. Расслабление (мин)',
        t3: '3. Чтение книги',
        t4: '4. Хотира (память)',
        t5: '5. План на день',
        t6: '6. Работа над целью',
        t7: '7. Улыбка',
        t8: '8. Уверенность',
        t9: '9. Аффирмации'
    };

    // Точное локальное время YYYY-MM-DD (без сдвига часового пояса UTC)
    function getLocalTodayStr(d = new Date()) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    }

    function normalizeDateStr(raw) {
        if (!raw) return getLocalTodayStr();
        const s = String(raw).trim();
        if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
        if (/^\d{4}-\d{2}-\d{2}T/.test(s)) {
            const dt = new Date(s);
            return isNaN(dt.getTime()) ? s.slice(0, 10) : getLocalTodayStr(dt);
        }
        const dmy = s.match(/^(\d{2})\.(\d{2})\.(\d{4})/);
        if (dmy) return `${dmy[3]}-${dmy[2]}-${dmy[1]}`;
        const parsed = new Date(s);
        return isNaN(parsed.getTime()) ? s : getLocalTodayStr(parsed);
    }

    function parseMinutes(val) {
        if (typeof val === 'number') return isNaN(val) ? 0 : Math.max(0, Math.round(val));
        if (!val) return 0;
        const m = String(val).replace(',', '.').match(/(\d+(\.\d+)?)/);
        return m ? Math.max(0, Math.round(parseFloat(m[1]))) : 0;
    }

    function isTaskDone(rep, key) {
        if (!rep) return false;
        if (key === 't1') return parseMinutes(rep.physicalExerciseMin) > 0;
        if (key === 't2') return parseMinutes(rep.relaxationMin) > 0;
        if (key === 't3') {
            const b = String(rep.readingBookDetails || '').trim();
            return b.length > 0 && b !== '0' && b.toLowerCase() !== 'нет' && b !== '-';
        }
        if (key === 't4') return Boolean(rep.memoryCompleted);
        if (key === 't5') return Boolean(rep.planCompleted);
        if (key === 't6') return Boolean(rep.goalCompleted);
        if (key === 't7') return Boolean(rep.smileCompleted);
        if (key === 't8') return Boolean(rep.confidenceCompleted);
        if (key === 't9') return Boolean(rep.affirmationCompleted);
        return false;
    }

    // Автоматический подсчет выполненных задач из 9 (исправляет баг 0/9 при отправке отчета)
    function computeCompletedTasksCount(rep) {
        let count = 0;
        ['t1','t2','t3','t4','t5','t6','t7','t8','t9'].forEach(k => {
            if (isTaskDone(rep, k)) count++;
        });
        return count;
    }

    function normalizeReport(r) {
        const norm = {
            id: String(r.id || ''),
            date: normalizeDateStr(r.date),
            time: String(r.time || ''),
            userId: String(r.userId || ''),
            userName: String(r.userName || 'Ученик'),
            physicalExerciseMin: String(r.physicalExerciseMin ?? '0').trim() || '0',
            relaxationMin: String(r.relaxationMin ?? '0').trim() || '0',
            readingBookDetails: String(r.readingBookDetails ?? '').trim(),
            memoryCompleted: r.memoryCompleted === true || String(r.memoryCompleted).toUpperCase() === 'ДА',
            planCompleted: r.planCompleted === true || String(r.planCompleted).toUpperCase() === 'ДА',
            goalCompleted: r.goalCompleted === true || String(r.goalCompleted).toUpperCase() === 'ДА',
            smileCompleted: r.smileCompleted === true || String(r.smileCompleted).toUpperCase() === 'ДА',
            confidenceCompleted: r.confidenceCompleted === true || String(r.confidenceCompleted).toUpperCase() === 'ДА',
            affirmationCompleted: r.affirmationCompleted === true || String(r.affirmationCompleted).toUpperCase() === 'ДА',
            comments: String(r.comments ?? '').trim()
        };
        const calc = computeCompletedTasksCount(norm);
        const rawCount = Number(r.completedCoreTasksCount || 0);
        norm.completedCoreTasksCount = calc > 0 ? calc : Math.min(9, Math.max(0, rawCount));
        return norm;
    }

    // Уведомления без блокировки экрана
    function showToast(msg, isError = false) {
        const el = document.getElementById('toast-container');
        if (!el) return;
        el.innerText = msg;
        el.style.backgroundColor = isError ? '#7F1D1D' : '#064E3B';
        el.style.borderColor = isError ? '#EF4444' : '#10B981';
        el.classList.remove('hidden');
        clearTimeout(window._toastTimer);
        window._toastTimer = setTimeout(() => {
            el.classList.add('hidden');
        }, 3200);
    }

    function escapeHtml(str) {
        return String(str ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // ============================================================================
    // БЫСТРЫЕ ЗАПРОСЫ К СЕРВЕРУ (КЭШ-ПРОКСИ + ПРЯМОЙ GOOGLE APPS SCRIPT FALLBACK)
    // ============================================================================
    async function postAPI(data) {
        // 1. Попытка через быстрый серверный прокси (если запущен на сервере)
        if (location.protocol.startsWith('http')) {
            try {
                const proxyRes = await fetch('/api/gas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (proxyRes.ok) return await proxyRes.json();
            } catch (_) {}
        }

        // 2. Прямой запрос к Google Apps Script (работает и локально из файла index.html)
        try {
            const res = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(data)
            });
            return await res.json();
        } catch (e) {
            console.error('API POST Error:', e);
            return { status: 'error', message: e.message };
        }
    }

    async function getAPI(action, params = {}) {
        let url = `${WEBHOOK_URL}?action=${action}`;
        for (let k in params) {
            if (params[k]) url += `&${k}=${encodeURIComponent(params[k])}`;
        }
        try {
            const res = await fetch(url);
            return await res.json();
        } catch (e) {
            console.error('API GET Error:', e);
            return { status: 'error', message: e.message };
        }
    }

    // ============================================================================
    // СИНХРОНИЗАЦИЯ ДАННЫХ С КЭШИРОВАНИЕМ
    // ============================================================================
    async function syncAllData(force = false) {
        if (!state.currentUser || state.isSyncing) return;
        state.isSyncing = true;
        const syncIcon = document.getElementById('sync-icon');
        if (syncIcon) syncIcon.classList.add('fa-spin');

        const startT = performance.now();
        let syncedViaProxy = false;

        if (location.protocol.startsWith('http')) {
            try {
                const q = `?userId=${encodeURIComponent(state.currentUser.id)}${force ? '&force=true' : ''}`;
                const res = await fetch('/api/sync' + q);
                if (res.ok) {
                    const data = await res.json();
                    if (data.status === 'success') {
                        state.users = data.users || [];
                        state.reports = (data.reports || []).map(normalizeReport);
                        state.quotes = data.quotes || [];
                        state.messages = data.messages || [];
                        syncedViaProxy = true;
                    }
                }
            } catch (_) {}
        }

        if (!syncedViaProxy) {
            const [usersRes, reportsRes, quotesRes, msgsRes] = await Promise.all([
                getAPI('get_users'),
                getAPI('get_reports'),
                getAPI('get_quotes'),
                getAPI('get_messages', { userId: state.currentUser.id })
            ]);

            if (usersRes.users) state.users = usersRes.users;
            if (reportsRes.reports) state.reports = reportsRes.reports.map(normalizeReport);
            if (quotesRes.quotes) state.quotes = quotesRes.quotes;
            if (msgsRes.messages) state.messages = msgsRes.messages;
        }

        state.lastSyncLatencyMs = Math.round(performance.now() - startT);
        state.isSyncing = false;
        if (syncIcon) syncIcon.classList.remove('fa-spin');

        const latLabel = document.getElementById('sync-latency-label');
        if (latLabel) latLabel.innerText = `${state.lastSyncLatencyMs}мс`;

        // Обновляем данные текущего пользователя
        const updatedMe = state.users.find(u => u.id === state.currentUser.id);
        if (updatedMe) {
            state.currentUser = updatedMe;
            localStorage.setItem('web_user', JSON.stringify(updatedMe));
        }

        // Сохраняем в локальный кэш для мгновенного открытия
        try {
            localStorage.setItem('marathon_cache_v3', JSON.stringify({
                users: state.users,
                reports: state.reports,
                quotes: state.quotes,
                messages: state.messages
            }));
        } catch (_) {}

        updateNotificationBadge();
        render();
    }

    function updateNotificationBadge() {
        if (!state.currentUser) return;
        const isMentor = state.currentUser.role === 'MENTOR';
        const myReportsCount = isMentor
            ? state.reports.length
            : state.reports.filter(r => r.userId === state.currentUser.id).length;
        const badge = document.getElementById('top-notification-count');
        if (badge) badge.innerText = myReportsCount + state.messages.length;
    }

    // ============================================================================
    // АВТОРИЗАЦИЯ
    // ============================================================================
    async function handleLogin() {
        const loginInput = document.getElementById('login-username').value.trim();
        const passInput = document.getElementById('login-password').value.trim();

        if (!loginInput || !passInput) {
            showToast('Пожалуйста, введите логин и пароль', true);
            return;
        }

        const btn = document.getElementById('login-btn');
        btn.innerText = 'Вход в систему...';
        btn.disabled = true;

        const res = await postAPI({ action: 'login', login: loginInput, password: passInput });
        btn.innerText = 'Войти в марафон';
        btn.disabled = false;

        if (res.status === 'success' && res.user) {
            state.currentUser = res.user;
            state.activeTab = 'home';
            localStorage.setItem('web_user', JSON.stringify(res.user));
            document.getElementById('login-screen').classList.add('hidden');
            showToast(`Добро пожаловать, ${res.user.name}!`);
            render();
            await syncAllData(true);
        } else {
            showToast(res.message || 'Ошибка входа: проверьте логин и пароль', true);
        }
    }

    function logout() {
        stopRelaxAudio();
        state.currentUser = null;
        state.activeTab = 'home';

        render();

    function switchTab(tab) {
        const isMentor = state.currentUser && state.currentUser.role === 'MENTOR';

        if (!isMentor && (tab === 'analytics' || tab === 'mentor')) {
            state.activeTab = 'history';

            state.activeTab = tab;
        }
        render();
    }

    function renderNav() {
        const isMentor = state.currentUser && state.currentUser.role === 'MENTOR';

        // Ученикам недоступна вкладка Аналитика — только их задания и история отчетов
        const items = isMentor ? [

            { tab: 'mentor', title: 'Ученики', icon: 'fa-users' },

            { tab: 'history', title: 'История', icon: 'fa-clock-rotate-left' }
        ] : [

            { tab: 'tasks', title: 'Задания', icon: 'fa-list-check' },
            { tab: 'chat', title: 'Чат', icon: 'fa-comments' },
            { tab: 'relaxation', title: 'Расслабление', icon: 'fa-spa' },

        ];

        document.getElementById('bottom-nav').innerHTML = items.map(i => `
            <div class="nav-item ${state.activeTab === i.tab ? 'active' : ''}" onclick="switchTab('${i.tab}')">
                <i class="fa-solid ${i.icon}"></i>

    function renderTopBar() {
        if (!state.currentUser) return;
        document.getElementById('top-user-name').innerText = state.currentUser.name;
        const tag = document.getElementById('top-user-role');
        if (state.currentUser.role === 'MENTOR') {

    function render() {
        if (!state.currentUser) {
            document.getElementById('login-screen').classList.remove('hidden');
            return;

        document.getElementById('login-screen').classList.add('hidden');

        const isMentor = state.currentUser.role === 'MENTOR';
        if (!isMentor && (state.activeTab === 'analytics' || state.activeTab === 'mentor')) {
            state.activeTab = 'home';
        }

        renderTopBar();
        renderNav();

        const c = document.getElementById('main-content');
        c.innerHTML = '';

        if (state.activeTab === 'home') renderHome(c);
        else if (state.activeTab === 'mentor' && isMentor) renderMentor(c);
        else if (state.activeTab === 'analytics' && isMentor) renderAnalytics(c);
        else if (state.activeTab === 'tasks') renderTasks(c);
        else if (state.activeTab === 'chat') renderChat(c);
        else if (state.activeTab === 'relaxation') renderRelaxation(c);
        else if (state.activeTab === 'history') renderHistory(c);
        else if (state.activeTab === 'profile') renderProfile(c);
    }

        const res = await postAPI({
            action: 'update_quote',
            quote: {
                dayOfMonth: state.mentorQuoteDay,
                text: t,
                author: state.currentUser.name,
                category: 'Мотивация дня'
            }
        });
        if (res.status === 'success') {

    async function submitStudentModal() {
        const editId = document.getElementById('edit-user-id').value.trim();
        const name = document.getElementById('new-name').value.trim();
        const login = document.getElementById('new-login').value.trim();
        const pass = document.getElementById('new-pass').value.trim();
        const phone = document.getElementById('new-phone').value.trim();

        if (!name || !login || !pass) return showToast('Заполните обязательные поля!', true);

        const existing = editId ? state.users.find(u => u.id === editId) : null;
        const userObj = {
            id: existing ? existing.id : ('student_' + Math.random().toString(36).substr(2, 8)),
            login,
            name,
            role: 'STUDENT',
            streakDays: existing ? (existing.streakDays || 0) : 0,
            totalReports: existing ? (existing.totalReports || 0) : 0,
            phoneOrNote: phone
        };

        closeModal();

            action: existing ? 'update_user' : 'add_user',

    async function deleteUser(id) {
        const u = state.users.find(item => item.id === id);
        if (!confirm(`Удалить ученика ${u ? u.name : ''}?`)) return;
        state.users = state.users.filter(item => item.id !== id);
        render();
        await postAPI({ action: 'delete_user', userId: id });
        showToast('Ученик удален');
        syncAllData(true);
    }

    // ============================================================================
    // 3. ПОЛНОЦЕННЫЙ ДАШБОРД АНАЛИТИКИ И ТАБЛИЦА БД (ТОЛЬКО ДЛЯ НАСТАВНИКА)
    // ============================================================================
    function getAnalyticsDateWindow() {
        const todayStr = getLocalTodayStr();
        const p = state.analyticsPeriodFilter;
        if (p === 'TODAY') return { start: todayStr, end: todayStr, days: 7 };
        if (p === 'WEEK') {
            const d = new Date(); d.setDate(d.getDate() - 6);
            return { start: getLocalTodayStr(d), end: todayStr, days: 7 };
        }
        if (p === 'DAYS_14') {
            const d = new Date(); d.setDate(d.getDate() - 13);
            return { start: getLocalTodayStr(d), end: todayStr, days: 14 };
        }
        if (p === 'MONTH') {
            const d = new Date(); d.setDate(d.getDate() - 29);
            return { start: getLocalTodayStr(d), end: todayStr, days: 30 };
        }
        if (p === 'CUSTOM') {
            const s = state.analyticsStartDate || '2024-01-01';
            const e = state.analyticsEndDate || todayStr;
            const diff = Math.round((new Date(e) - new Date(s)) / (1000 * 3600 * 24)) + 1;
            const days = Math.max(1, Math.min(60, isNaN(diff) ? 30 : diff));
            return { start: s <= e ? s : e, end: s <= e ? e : s, days };
        }
        // 'ALL'
        const allDates = state.reports.map(r => r.date).filter(Boolean).sort();
        return {
            start: allDates.length > 0 ? allDates[0] : '2024-01-01',
            end: todayStr,
            days: 30
        };
    }

    function getReportPctByTask(rep, taskKey) {
        if (!rep) return 0;
        if (taskKey === 'ALL') {
            return Math.round(((rep.completedCoreTasksCount || 0) / 9) * 100);
        }
        return isTaskDone(rep, taskKey) ? 100 : 0;
    }

    function getFilteredAnalyticsReports() {
        const { start, end } = getAnalyticsDateWindow();
        const todayStr = getLocalTodayStr();
        const submittedTodaySet = new Set(
            state.reports.filter(r => r.date === todayStr).map(r => r.userId)
        );
        const q = state.analyticsSearchQuery.trim().toLowerCase();

        return state.reports.filter(r => {
            if (state.analyticsStudentFilter !== 'ALL' && r.userId !== state.analyticsStudentFilter) {
                return false;
            }
            if (state.analyticsPeriodFilter !== 'ALL') {
                if (r.date < start || r.date > end) return false;
            }
            if (state.analyticsTodayStatus === 'SUBMITTED' && !submittedTodaySet.has(r.userId)) {
                return false;
            }
            if (state.analyticsTodayStatus === 'MISSING' && submittedTodaySet.has(r.userId)) {
                return false;
            }
            const count = r.completedCoreTasksCount || 0;
            if (state.analyticsLevelFilter === 'HIGH' && count < 8) return false;
            if (state.analyticsLevelFilter === 'MEDIUM' && (count < 5 || count > 7)) return false;
            if (state.analyticsLevelFilter === 'LOW' && count > 4) return false;

            if (q) {
                const matchName = (r.userName || '').toLowerCase().includes(q);
                const matchDate = (r.date || '').toLowerCase().includes(q);
                const matchBook = (r.readingBookDetails || '').toLowerCase().includes(q);
                const matchComm = (r.comments || '').toLowerCase().includes(q);
                if (!matchName && !matchDate && !matchBook && !matchComm) return false;
            }
            return true;
        });
    }

    function renderAnalytics(c) {
        const students = state.users.filter(u => u.role === 'STUDENT');
        const todayStr = getLocalTodayStr();
        const submittedTodaySet = new Set(
            state.reports.filter(r => r.date === todayStr).map(r => r.userId)
        );
        const submittedTodayCount = students.filter(s => submittedTodaySet.has(s.id)).length;

        const { start, end, days } = getAnalyticsDateWindow();
        const filteredReports = getFilteredAnalyticsReports();

        // Сортировка таблицы отчетов
        const sortedReports = [...filteredReports].sort((a, b) => {
            let cmp = 0;
            const f = state.analyticsSortField;
            if (f === 'date') cmp = a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || '');
            else if (f === 'userName') cmp = (a.userName || '').localeCompare(b.userName || '', 'ru');
            else if (f === 'completedCoreTasksCount') cmp = (a.completedCoreTasksCount || 0) - (b.completedCoreTasksCount || 0);
            else if (f === 'physicalExerciseMin') cmp = parseMinutes(a.physicalExerciseMin) - parseMinutes(b.physicalExerciseMin);
            else if (f === 'relaxationMin') cmp = parseMinutes(a.relaxationMin) - parseMinutes(b.relaxationMin);
            return state.analyticsSortDir === 'asc' ? cmp : -cmp;
        });

        // Сводные KPI показатели по выборке
        let sumPct = 0, sumTasks = 0, totalPhysMin = 0, totalRelaxMin = 0, booksCount = 0;
        const uniqueStudentsSet = new Set();
        filteredReports.forEach(r => {
            uniqueStudentsSet.add(r.userId);
            sumTasks += (r.completedCoreTasksCount || 0);
            sumPct += getReportPctByTask(r, state.analyticsTaskFilter);
            totalPhysMin += parseMinutes(r.physicalExerciseMin);
            totalRelaxMin += parseMinutes(r.relaxationMin);
            if (isTaskDone(r, 't3')) booksCount++;
        });

        const avgPct = filteredReports.length > 0 ? Math.round(sumPct / filteredReports.length) : 0;
        const avgTasks = filteredReports.length > 0 ? (sumTasks / filteredReports.length).toFixed(1) : '0.0';

        // Построение точек графика по дням (0% .. 100%)
        const endRefDate = (state.analyticsPeriodFilter === 'CUSTOM' && state.analyticsEndDate)
            ? new Date(state.analyticsEndDate)
            : new Date();
        const chartPoints = [];

        for (let i = days - 1; i >= 0; i--) {
            const d = new Date(endRefDate);
            d.setDate(d.getDate() - i);
            const dateStr = getLocalTodayStr(d);
            const dayReps = filteredReports.filter(r => r.date === dateStr);

            let pct = 0;
            if (dayReps.length > 0) {
                const s = dayReps.reduce((acc, rep) => acc + getReportPctByTask(rep, state.analyticsTaskFilter), 0);
                pct = Math.round(s / dayReps.length);
            }

            chartPoints.push({
                dateStr,
                label: `${d.getDate()} ${monthsRu[d.getMonth()]}`,
                pct,
                count: dayReps.length
            });
        }

        const svgW = 620;
        const svgH = 185;
        const stepX = chartPoints.length > 1 ? svgW / (chartPoints.length - 1) : svgW / 2;

        const coords = chartPoints.map((pt, idx) => {
            const x = chartPoints.length > 1 ? idx * stepX : svgW / 2;
            const clampedPct = Math.min(100, Math.max(0, pt.pct));
            const y = (svgH - 22) - (clampedPct / 100) * (svgH - 42);
            return { x, y, pt, idx };
        });

        const pointStr = coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
        const areaPath = coords.length > 0
            ? `M ${coords[0].x.toFixed(1)} ${svgH - 22} ` +
              coords.map(c => `L ${c.x.toFixed(1)} ${c.y.toFixed(1)}`).join(' ') +
              ` L ${coords[coords.length - 1].x.toFixed(1)} ${svgH - 22} Z`
            : '';

        // Подписи оси X (равные интервалы с использованием исправленного monthsRu)
        const tickCount = days <= 7 ? days : 6;
        const xDateLabels = [];
        if (chartPoints.length > 0) {
            const step = Math.max(1, (chartPoints.length - 1) / Math.max(1, tickCount - 1));
            for (let i = 0; i < tickCount; i++) {
                const idx = Math.min(chartPoints.length - 1, Math.round(i * step));
                xDateLabels.push(chartPoints[idx].label);
            }
        }

        const selectedStudentObj = students.find(s => s.id === state.analyticsStudentFilter);
        const activePoint = (state.analyticsSelectedPointIdx !== null && chartPoints[state.analyticsSelectedPointIdx])
            ? chartPoints[state.analyticsSelectedPointIdx]
            : null;

        // Статистика по каждой из 9 задач
        const tasksBreakdownHtml = ['t1','t2','t3','t4','t5','t6','t7','t8','t9'].map(tKey => {
            const doneCount = filteredReports.filter(r => isTaskDone(r, tKey)).length;
            const pct = filteredReports.length > 0 ? Math.round((doneCount / filteredReports.length) * 100) : 0;
            const isSelected = state.analyticsTaskFilter === tKey;
            const barColor = pct >= 80 ? 'var(--emerald)' : pct >= 50 ? 'var(--cyan)' : 'var(--gold)';
            return `
                <div onclick="setAnalyticsTask('${isSelected ? 'ALL' : tKey}')" style="cursor:pointer; padding:7px 10px; border-radius:10px; border:1px solid ${isSelected ? 'var(--cyan)' : 'transparent'}; background:${isSelected ? 'rgba(0,210,255,0.12)' : 'rgba(15,23,42,0.4)'};">
                    <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;">
                        <span style="font-weight:${isSelected ? '800' : '600'}; color:${isSelected ? 'var(--cyan)' : 'var(--text-white)'};">${TASK_NAMES[tKey]}</span>
                        <span class="tabular-nums" style="font-weight:700; color:var(--text-muted);">${doneCount}/${filteredReports.length} (${pct}%)</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" style="width:${pct}%; background:${barColor};"></div>
                    </div>
                </div>
            `;
        }).join('');

        // Рейтинг учеников
        const studentRankings = students.map(s => {
            const sReps = filteredReports.filter(r => r.userId === s.id);
            const cnt = sReps.length;
            const sTasks = sReps.reduce((acc, r) => acc + (r.completedCoreTasksCount || 0), 0);
            const sPct = cnt > 0 ? Math.round((sTasks / (cnt * 9)) * 100) : 0;
            const sAvg = cnt > 0 ? (sTasks / cnt).toFixed(1) : '0.0';
            const sPhys = sReps.reduce((acc, r) => acc + parseMinutes(r.physicalExerciseMin), 0);
            const sRelax = sReps.reduce((acc, r) => acc + parseMinutes(r.relaxationMin), 0);
            const sBooks = sReps.filter(r => isTaskDone(r, 't3')).length;
            return {
                student: s,
                cnt,
                sPct,
                sAvg,
                sPhys,
                sRelax,
                sBooks,
                hasToday: submittedTodaySet.has(s.id)
            };
        }).sort((a, b) => b.sPct - a.sPct || b.cnt - a.cnt);

        let html = `
            <!-- Шапка Дашборда -->
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
                <div>
                    <h2 style="font-size:22px; font-weight:800;">Аналитический Дашборд Наставника 📊</h2>

                    </div>
                </div>

                    <button class="btn btn-cyan btn-sm" onclick="syncAllData(true)"><i class="fa-solid fa-rotate"></i> Обновить БД</button>
                </div>
            </div>

            <!-- 4 KPI Карточки -->
            <div class="grid-4">
                <div class="card" style="padding:16px;">
                    <div style="color:var(--text-muted); font-size:12px;">Отчетов по фильтру</div>
                    <div class="tabular-nums" style="font-size:26px; font-weight:800; margin-top:4px;">${filteredReports.length} <span style="font-size:12px; font-weight:500; color:var(--text-muted);">из ${state.reports.length}</span></div>
                    <div style="font-size:11px; color:var(--text-muted); margin-top:6px;">Учеников в выборке: <b style="color:var(--text-white);">${uniqueStudentsSet.size}</b> из ${students.length}</div>
                </div>

                <div class="card" style="padding:16px;">
                    <div style="color:var(--text-muted); font-size:12px;">Средняя успеваемость</div>
                    <div class="tabular-nums" style="font-size:26px; font-weight:800; color:var(--cyan); margin-top:4px;">${avgPct}% <span style="font-size:12px; font-weight:600; color:var(--text-muted);">(${avgTasks}/9)</span></div>
                    <div class="progress-track" style="margin-top:8px;">
                        <div class="progress-fill" style="width:${avgPct}%; background:var(--cyan);"></div>
                    </div>
                </div>

                <div class="card" style="padding:16px;">

                        ${totalPhysMin} <span style="font-size:11px; color:var(--text-muted);">мин физ.</span> / ${totalRelaxMin} <span style="font-size:11px; color:var(--text-muted);">мин релакс</span>

                        <div class="filter-bar">
                            <div class="filter-chip ${state.analyticsPeriodFilter === 'TODAY' ? 'active' : ''}" onclick="setAnalyticsPeriod('TODAY')">Сегодня</div>
                            <div class="filter-chip ${state.analyticsPeriodFilter === 'WEEK' ? 'active' : ''}" onclick="setAnalyticsPeriod('WEEK')">7 дней</div>
                            <div class="filter-chip ${state.analyticsPeriodFilter === 'DAYS_14' ? 'active' : ''}" onclick="setAnalyticsPeriod('DAYS_14')">14 дней</div>
                            <div class="filter-chip ${state.analyticsPeriodFilter === 'MONTH' ? 'active' : ''}" onclick="setAnalyticsPeriod('MONTH')">30 дней</div>
                            <div class="filter-chip ${state.analyticsPeriodFilter === 'ALL' ? 'active' : ''}" onclick="setAnalyticsPeriod('ALL')">Все</div>
                            <div class="filter-chip ${state.analyticsPeriodFilter === 'CUSTOM' ? 'active' : ''}" onclick="setAnalyticsPeriod('CUSTOM')">От — До</div>
                        </div>
                    </div>

                    <div style="display:flex; flex-direction:column; gap:6px;">
                        <span style="font-size:12px; color:var(--text-muted); font-weight:700;">4. Уровень выполнения:</span>
                        <div class="filter-bar">
                            <div class="filter-chip ${state.analyticsLevelFilter === 'ALL' ? 'active' : ''}" onclick="setAnalyticsLevel('ALL')">Все</div>
                            <div class="filter-chip ${state.analyticsLevelFilter === 'HIGH' ? 'active' : ''}" onclick="setAnalyticsLevel('HIGH')">8–9 задач</div>
                            <div class="filter-chip ${state.analyticsLevelFilter === 'MEDIUM' ? 'active' : ''}" onclick="setAnalyticsLevel('MEDIUM')">5–7 задач</div>
                            <div class="filter-chip ${state.analyticsLevelFilter === 'LOW' ? 'active' : ''}" onclick="setAnalyticsLevel('LOW')">0–4 задач</div>
                        </div>
                    </div>

                    <div style="display:flex; flex-direction:column; gap:6px;">
                        <span style="font-size:12px; color:var(--text-muted); font-weight:700;">5. Поиск по таблице (имя, книга, дата, коммент):</span>
                        <input type="text" id="analytics-search-input" placeholder="Быстрый поиск..." value="${escapeHtml(state.analyticsSearchQuery)}" oninput="handleAnalyticsSearch(this.value)">
                    </div>
                </div>

                ${state.analyticsPeriodFilter === 'CUSTOM' ? `
                    <div class="grid-2" style="background:var(--surface-dark); padding:12px; border-radius:12px; border:1px solid var(--border);">
                        <div>
                            <label style="font-size:11px; color:var(--text-muted);">Начало периода (От):</label>
                            <input type="date" value="${state.analyticsStartDate}" onchange="state.analyticsStartDate=this.value; render();">
                        </div>
                        <div>
                            <label style="font-size:11px; color:var(--text-muted);">Конец периода (До):</label>
                            <input type="date" value="${state.analyticsEndDate}" onchange="state.analyticsEndDate=this.value; render();">
                        </div>
                    </div>
                ` : ''}
            </div>

            <!-- Графики: Линейный график Cyan + Разбивка по 9 задачам -->
            <div class="analytics-charts-grid">
                <!-- Линейный график 0..100% -->
                <div class="card" style="background:#1E222D; display:flex; flex-direction:column; justify-content:space-between; gap:14px;">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px;">
                        <div>
                            <div style="font-size:17px; font-weight:800; color:#F8FAFC;">${TASK_NAMES[state.analyticsTaskFilter]}</div>
                            <div style="font-size:13px; color:var(--cyan); font-weight:600; margin-top:2px;">
                                Ученик: ${selectedStudentObj ? escapeHtml(selectedStudentObj.name) : `Все ученики (${students.length})`}
                            </div>
                        </div>
                        <span style="font-weight:700; color:var(--cyan); font-size:13px;">Ось Y: 0% — 100%</span>
                    </div>

                    <div style="background:rgba(15,23,42,0.65); padding:8px 12px; border-radius:10px; font-size:12px; display:flex; justify-content:space-between; align-items:center;">
                        ${activePoint ? `
                            <span>📅 <b>${activePoint.label} (${activePoint.dateStr})</b></span>
                            <span class="tabular-nums" style="color:var(--cyan); font-weight:800;">Выполнение: ${activePoint.pct}% (отчетов: ${activePoint.count})</span>
                        ` : `
                            <span style="color:var(--text-muted);">Нажмите на любую точку графика для просмотра точного результата за день</span>
                        `}
                    </div>

                    <div style="display:flex; gap:10px; align-items:stretch;">
                        <div class="tabular-nums" style="display:flex; flex-direction:column; justify-content:space-between; font-size:11px; font-weight:700; color:#94A3B8; text-align:right; width:38px; padding-bottom:14px;">
                            <span>100%</span>
                            <span>75%</span>
                            <span>50%</span>
                            <span>25%</span>
                            <span>0%</span>
                        </div>

                        <div style="flex:1; overflow-x:auto;">
                            <svg viewBox="0 0 ${svgW} ${svgH}" style="width:100%; height:185px; overflow:visible;">
                                <defs>
                                    <linearGradient id="cyanGrad" x1="0" y1="0" x2="0" y2="1">
                                        <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.28"/>
                                        <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.0"/>
                                    </linearGradient>
                                </defs>
                                <line x1="0" y1="20" x2="${svgW}" y2="20" stroke="#2A2D3D" stroke-width="1" />
                                <line x1="0" y1="55.7" x2="${svgW}" y2="55.7" stroke="#2A2D3D" stroke-width="1" />
                                <line x1="0" y1="91.5" x2="${svgW}" y2="91.5" stroke="#2A2D3D" stroke-width="1" />
                                <line x1="0" y1="127.2" x2="${svgW}" y2="127.2" stroke="#2A2D3D" stroke-width="1" />
                                <line x1="0" y1="163" x2="${svgW}" y2="163" stroke="#2A2D3D" stroke-width="1" />

                                ${areaPath ? `<path d="${areaPath}" fill="url(#cyanGrad)" />` : ''}
                                <polyline points="${pointStr}" fill="none" stroke="#00D2FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

                                ${coords.map(c => `
                                    <g style="cursor:pointer;" onclick="state.analyticsSelectedPointIdx=${c.idx}; render();">
                                        <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="10" fill="transparent" />
                                        <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="${state.analyticsSelectedPointIdx === c.idx ? 5.5 : (c.pt.count > 0 ? 3.5 : 2)}" fill="${c.pt.count > 0 ? '#00D2FF' : '#475569'}" stroke="#0F172A" stroke-width="1.5" />
                                    </g>
                                `).join('')}
                            </svg>
                        </div>
                    </div>

                    <div class="tabular-nums" style="display:flex; justify-content:space-between; color:#94A3B8; font-size:11px; font-weight:600; padding-left:48px;">
                        ${xDateLabels.map(lbl => `<span>${lbl}</span>`).join('')}
                    </div>
                </div>

                <!-- Рейтинг выполнения 9 задач -->
                <div class="card" style="display:flex; flex-direction:column; justify-content:space-between; gap:10px;">
                    <div>
                        <div style="font-size:16px; font-weight:800;">Выполнение каждой из 9 задач</div>
                        <div style="font-size:11px; color:var(--text-muted);">Нажмите на задачу для фильтрации графика</div>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:6px;">
                        ${tasksBreakdownHtml}
                    </div>
                </div>
            </div>

            <!-- Блок Таблиц БД Google Sheets -->
            <div class="card" style="display:flex; flex-direction:column; gap:14px; padding:18px;">
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                    <!-- Переключатель 3 видов таблиц -->
                    <div class="filter-bar">
                        <div class="filter-chip ${state.analyticsTableMode === 'REPORTS_TABLE' ? 'active' : ''}" onclick="state.analyticsTableMode='REPORTS_TABLE'; render();">
                            <i class="fa-solid fa-table"></i> Таблица отчетов БД (${sortedReports.length})
                        </div>
                        <div class="filter-chip ${state.analyticsTableMode === 'DAILY_MATRIX' ? 'active' : ''}" onclick="state.analyticsTableMode='DAILY_MATRIX'; render();">
                            <i class="fa-solid fa-calendar-check"></i> Шахматка по дням
                        </div>
                        <div class="filter-chip ${state.analyticsTableMode === 'STUDENTS_RANKING' ? 'active' : ''}" onclick="state.analyticsTableMode='STUDENTS_RANKING'; render();">
                            <i class="fa-solid fa-ranking-star"></i> Рейтинг учеников (${students.length})
                        </div>
                    </div>

                    <!-- Быстрый фильтр сдачи сегодня -->
                    <div class="filter-bar">
                        <div class="filter-chip ${state.analyticsTodayStatus === 'ALL' ? 'active' : ''}" onclick="state.analyticsTodayStatus='ALL'; render();">Все</div>
                        <div class="filter-chip ${state.analyticsTodayStatus === 'SUBMITTED' ? 'active' : ''}" onclick="state.analyticsTodayStatus='SUBMITTED'; render();">Сдали сегодня (${submittedTodayCount})</div>
                        <div class="filter-chip ${state.analyticsTodayStatus === 'MISSING' ? 'active' : ''}" onclick="state.analyticsTodayStatus='MISSING'; render();">Не сдали (${Math.max(0, students.length - submittedTodayCount)})</div>
                    </div>
                </div>

                ${renderAnalyticsActiveTable(sortedReports, studentRankings, chartPoints, avgTasks, avgPct, totalPhysMin, totalRelaxMin, booksCount)}
            </div>
        `;

        c.innerHTML = html;
    }

    function renderAnalyticsActiveTable(sortedReports, studentRankings, chartPoints, avgTasks, avgPct, totalPhysMin, totalRelaxMin, booksCount) {
        if (state.analyticsTableMode === 'REPORTS_TABLE') {
            const sortIcon = (field) => {
                if (state.analyticsSortField !== field) return '<i class="fa-solid fa-sort" style="opacity:0.4;"></i>';
                return state.analyticsSortDir === 'asc'
                    ? '<i class="fa-solid fa-sort-up" style="color:var(--cyan);"></i>'
                    : '<i class="fa-solid fa-sort-down" style="color:var(--cyan);"></i>';
            };

            return `
                <div class="table-wrapper">
                    <table class="data-table tabular-nums">
                        <thead>
                            <tr>
                                <th class="sortable" onclick="toggleAnalyticsSort('date')">Дата ${sortIcon('date')}</th>
                                <th class="sortable" onclick="toggleAnalyticsSort('userName')">Ученик ${sortIcon('userName')}</th>
                                <th class="sortable" style="text-align:center;" onclick="toggleAnalyticsSort('completedCoreTasksCount')">Итог (9) ${sortIcon('completedCoreTasksCount')}</th>
                                <th class="sortable" style="text-align:right;" onclick="toggleAnalyticsSort('physicalExerciseMin')">1. Физ. ${sortIcon('physicalExerciseMin')}</th>
                                <th class="sortable" style="text-align:right;" onclick="toggleAnalyticsSort('relaxationMin')">2. Релакс ${sortIcon('relaxationMin')}</th>
                                <th>3. Книга</th>
                                <th style="text-align:center;">4. Хот</th>
                                <th style="text-align:center;">5. План</th>
                                <th style="text-align:center;">6. Цель</th>
                                <th style="text-align:center;">7. Улыб</th>
                                <th style="text-align:center;">8. Увер</th>
                                <th style="text-align:center;">9. Афф</th>
                                <th>Комментарий</th>
                                <th style="text-align:right;">Действия</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${sortedReports.length === 0 ? `
                                <tr><td colspan="14" style="text-align:center; padding:26px; color:var(--text-muted);">Отчетов по выбранным фильтрам не найдено</td></tr>
                            ` : sortedReports.map(r => {
                                const cnt = r.completedCoreTasksCount || 0;
                                const pct = Math.round((cnt / 9) * 100);
                                const scoreColor = cnt >= 8 ? 'var(--emerald)' : cnt >= 5 ? 'var(--cyan)' : 'var(--gold)';
                                const yesNo = (v) => v ? '<span class="badge-yes">ДА</span>' : '<span class="badge-no">—</span>';
                                return `
                                    <tr>
                                        <td style="white-space:nowrap;">
                                            <b>${escapeHtml(r.date)}</b>
                                            ${r.time ? `<div style="font-size:10px; color:var(--text-muted);">${escapeHtml(r.time)}</div>` : ''}
                                        </td>
                                        <td style="white-space:nowrap;">
                                            <span style="color:var(--cyan); font-weight:700; cursor:pointer;" onclick="setAnalyticsStudent('${r.userId}')">${escapeHtml(r.userName)}</span>
                                        </td>
                                        <td style="text-align:center; font-weight:800; color:${scoreColor}; white-space:nowrap;">
                                            ${cnt}/9 (${pct}%)
                                        </td>
                                        <td style="text-align:right; white-space:nowrap;">${parseMinutes(r.physicalExerciseMin)} мин</td>
                                        <td style="text-align:right; white-space:nowrap;">${parseMinutes(r.relaxationMin)} мин</td>
                                        <td style="max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${escapeHtml(r.readingBookDetails)}">
                                            ${r.readingBookDetails ? escapeHtml(r.readingBookDetails) : '<span class="badge-no">—</span>'}
                                        </td>
                                        <td style="text-align:center;">${yesNo(r.memoryCompleted)}</td>
                                        <td style="text-align:center;">${yesNo(r.planCompleted)}</td>
                                        <td style="text-align:center;">${yesNo(r.goalCompleted)}</td>
                                        <td style="text-align:center;">${yesNo(r.smileCompleted)}</td>
                                        <td style="text-align:center;">${yesNo(r.confidenceCompleted)}</td>
                                        <td style="text-align:center;">${yesNo(r.affirmationCompleted)}</td>
                                        <td style="max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${escapeHtml(r.comments)}">
                                            ${r.comments ? escapeHtml(r.comments) : '<span class="badge-no">—</span>'}
                                        </td>
                                        <td style="text-align:right; white-space:nowrap;">
                                            <button class="btn btn-surface btn-sm" onclick="inspectReportModal('${r.id}')" title="Подробно"><i class="fa-solid fa-eye"></i></button>
                                            <button class="btn btn-surface btn-sm" style="color:var(--danger);" onclick="deleteReport('${r.id}')" title="Удалить"><i class="fa-solid fa-trash"></i></button>
                                        </td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                        ${sortedReports.length > 0 ? `
                            <tfoot>
                                <tr>
                                    <td>ИТОГО / СРЕДНЕЕ</td>
                                    <td>Отчетов: ${sortedReports.length}</td>
                                    <td style="text-align:center; color:var(--cyan);">Ср: ${avgTasks}/9 (${avgPct}%)</td>
                                    <td style="text-align:right; color:var(--gold);">${totalPhysMin} мин</td>
                                    <td style="text-align:right; color:var(--purple);">${totalRelaxMin} мин</td>
                                    <td>Книг: ${booksCount}</td>
                                    <td colspan="8" style="text-align:right; color:var(--text-muted); font-weight:500;">Синхронизировано с Google Sheets</td>
                                </tr>
                            </tfoot>
                        ` : ''}
                    </table>
                </div>
            `;
        }

        if (state.analyticsTableMode === 'DAILY_MATRIX') {
            const matrixDays = chartPoints.slice(-14);
            return `
                <div class="table-wrapper">
                    <table class="data-table tabular-nums">
                        <thead>
                            <tr>
                                <th>Ученик</th>
                                <th style="text-align:center;">Ср. %</th>
                                ${matrixDays.map(d => `<th style="text-align:center;">${d.label}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>
                            ${studentRankings.map(row => `
                                <tr>
                                    <td style="font-weight:700; white-space:nowrap;">
                                        <span style="cursor:pointer; color:var(--cyan);" onclick="setAnalyticsStudent('${row.student.id}'); state.analyticsTableMode='REPORTS_TABLE'; render();">${escapeHtml(row.student.name)}</span>
                                    </td>
                                    <td style="text-align:center; font-weight:800; color:var(--cyan);">${row.sPct}%</td>
                                    ${matrixDays.map(d => {
                                        const rep = state.reports.find(r => r.userId === row.student.id && r.date === d.dateStr);
                                        if (!rep) return `<td style="text-align:center; color:#475569;">—</td>`;
                                        const cnt = rep.completedCoreTasksCount || 0;
                                        const bg = cnt >= 8 ? 'rgba(16,185,129,0.2)' : cnt >= 5 ? 'rgba(0,210,255,0.2)' : 'rgba(255,183,3,0.2)';
                                        const col = cnt >= 8 ? 'var(--emerald)' : cnt >= 5 ? 'var(--cyan)' : 'var(--gold)';
                                        return `<td style="text-align:center;"><span onclick="inspectReportModal('${rep.id}')" style="cursor:pointer; padding:4px 7px; border-radius:7px; background:${bg}; color:${col}; font-weight:800;">${cnt}/9</span></td>`;
                                    }).join('')}
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // STUDENTS_RANKING
        return `
            <div class="table-wrapper">
                <table class="data-table tabular-nums">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Ученик / Логин</th>
                            <th style="text-align:center;">Статус сегодня</th>
                            <th style="text-align:center;">Стрик</th>
                            <th style="text-align:center;">Отчетов</th>
                            <th>Средний прогресс</th>
                            <th style="text-align:right;">Физ. нагрузки</th>
                            <th style="text-align:right;">Расслабление</th>
                            <th style="text-align:center;">Книги</th>
                            <th style="text-align:right;">Фильтр</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${studentRankings.map((row, idx) => `
                            <tr>
                                <td style="font-weight:800; color:var(--text-muted);">${idx + 1}</td>
                                <td>
                                    <div style="font-weight:800;">${escapeHtml(row.student.name)}</div>
                                    <div style="font-size:11px; color:var(--text-muted);">@${escapeHtml(row.student.login)}</div>
                                </td>
                                <td style="text-align:center;">
                                    ${row.hasToday ? '<span style="color:var(--emerald); font-weight:800;">Сдал</span>' : '<span style="color:var(--danger); font-weight:700;">Не сдал</span>'}
                                </td>
                                <td style="text-align:center; font-weight:800; color:var(--gold);">🔥 ${row.student.streakDays || 0}</td>
                                <td style="text-align:center; font-weight:800;">${row.cnt}</td>
                                <td style="min-width:140px;">
                                    <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:4px;">
                                        <b style="color:var(--cyan);">${row.sPct}%</b>
                                        <span style="color:var(--text-muted);">${row.sAvg}/9</span>
                                    </div>
                                    <div class="progress-track">
                                        <div class="progress-fill" style="width:${row.sPct}%; background:var(--cyan);"></div>
                                    </div>
                                </td>
                                <td style="text-align:right;">${row.sPhys} мин</td>
                                <td style="text-align:right;">${row.sRelax} мин</td>
                                <td style="text-align:center;">${row.sBooks}</td>
                                <td style="text-align:right;">
                                    <button class="btn btn-surface btn-sm" style="color:var(--cyan);" onclick="setAnalyticsStudent('${row.student.id}'); state.analyticsTableMode='REPORTS_TABLE'; render();">Выбрать</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
    }

    function setAnalyticsStudent(id) { state.analyticsStudentFilter = id; state.analyticsSelectedPointIdx = null; render(); }
    function setAnalyticsTask(taskKey) { state.analyticsTaskFilter = taskKey; render(); }
    function setAnalyticsPeriod(p) { state.analyticsPeriodFilter = p; state.analyticsSelectedPointIdx = null; render(); }
    function setAnalyticsLevel(lvl) { state.analyticsLevelFilter = lvl; render(); }

    function toggleAnalyticsSort(field) {
        if (state.analyticsSortField === field) {
            state.analyticsSortDir = state.analyticsSortDir === 'asc' ? 'desc' : 'asc';
        } else {
            state.analyticsSortField = field;
            state.analyticsSortDir = 'desc';
        }
        render();
    }

    function handleAnalyticsSearch(val) {
        state.analyticsSearchQuery = val;
        render();
        const input = document.getElementById('analytics-search-input');
        if (input) {
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
        }
    }

    function resetAnalyticsFilters() {
        state.analyticsStudentFilter = 'ALL';
        state.analyticsTaskFilter = 'ALL';
        state.analyticsPeriodFilter = 'MONTH';
        state.analyticsLevelFilter = 'ALL';
        state.analyticsTodayStatus = 'ALL';
        state.analyticsSearchQuery = '';
        state.analyticsSelectedPointIdx = null;
        render();
    }

    function inspectReportModal(reportId) {
        const r = state.reports.find(item => item.id === reportId);
        if (!r) return;
        const modal = document.getElementById('modal-container');
        const body = document.getElementById('modal-body');
        const cnt = r.completedCoreTasksCount || 0;
        const pct = Math.round((cnt / 9) * 100);

        body.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                <div>
                    <h3 style="font-size:18px; font-weight:800;">Отчет: ${escapeHtml(r.userName)}</h3>
                    <div style="font-size:12px; color:var(--cyan); margin-top:2px;">Дата: ${escapeHtml(r.date)} ${r.time ? 'в ' + escapeHtml(r.time) : ''}</div>
                </div>
                <span class="role-tag role-student" style="font-size:13px; padding:6px 12px;">${cnt}/9 (${pct}%)</span>
            </div>

            <div class="grid-2" style="font-size:13px;">
                <div style="background:var(--surface-dark); padding:12px; border-radius:12px; border:1px solid var(--border);">
                    <div style="color:var(--text-muted); font-size:11px;">1. Физ. нагрузки:</div>
                    <div style="font-weight:800; margin-top:4px;">${escapeHtml(r.physicalExerciseMin)} мин</div>
                </div>
                <div style="background:var(--surface-dark); padding:12px; border-radius:12px; border:1px solid var(--border);">
                    <div style="color:var(--text-muted); font-size:11px;">2. Расслабление:</div>
                    <div style="font-weight:800; margin-top:4px;">${escapeHtml(r.relaxationMin)} мин</div>
                </div>
            </div>

            <div style="background:var(--surface-dark); padding:12px; border-radius:12px; border:1px solid var(--border); font-size:13px;">
                <div style="color:var(--text-muted); font-size:11px;">3. Чтение книги:</div>
                <div style="font-weight:700; margin-top:4px;">${r.readingBookDetails ? escapeHtml(r.readingBookDetails) : 'Не указано'}</div>
            </div>

            <div class="grid-2" style="font-size:12px;">
                <div>4. Хотира (память): <b>${r.memoryCompleted ? 'ДА ✅' : 'НЕТ'}</b></div>
