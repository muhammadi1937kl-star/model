    function exportAnalyticsCSV() {
        const rows = getFilteredAnalyticsReports();
        if (rows.length === 0) return showToast('Нет данных для экспорта', true);

        const headers = [
            'ID Отчета','Дата','Время','Ученик','Выполнено (из 9)','Процент (%)',
            '1. Физ. нагрузки (мин)','2. Расслабление (мин)','3. Книга',
            '4. Хотира','5. План','6. Цель','7. Улыбка','8. Уверенность','9. Аффирмации','Комментарий'
        ];
        const esc = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;

        const lines = rows.map(r => {
            const cnt = r.completedCoreTasksCount || 0;
            const pct = Math.round((cnt / 9) * 100);
            return [
                r.id, r.date, r.time || '', r.userName, cnt, `${pct}%`,
                r.physicalExerciseMin, r.relaxationMin, r.readingBookDetails,
                r.memoryCompleted ? 'ДА' : 'НЕТ',
                r.planCompleted ? 'ДА' : 'НЕТ',
                r.goalCompleted ? 'ДА' : 'НЕТ',
                r.smileCompleted ? 'ДА' : 'НЕТ',
                r.confidenceCompleted ? 'ДА' : 'НЕТ',
                r.affirmationCompleted ? 'ДА' : 'НЕТ',
                r.comments
            ].map(esc).join(';');
        });

        const csv = '\uFEFF' + [headers.map(esc).join(';'), ...lines].join('\r\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `marathon_analytics_${getLocalTodayStr()}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('Таблица успешно выгружена в CSV (Excel)!');
    }

    async function saveReport() {
        const selectedDate = state.taskSelectedDate || getLocalTodayStr();
        const existing = state.reports.find(r => r.userId === state.currentUser.id && r.date === selectedDate);

        const reportDraft = {
            id: existing ? existing.id : ('rep_' + Math.random().toString(36).substr(2, 8)),
            userId: state.currentUser.id,
            userName: state.currentUser.name,
            date: selectedDate,
            physicalExerciseMin: document.getElementById('t1').value.trim() || '0',
            relaxationMin: document.getElementById('t2').value.trim() || '0',
            readingBookDetails: document.getElementById('t3').value.trim(),
            memoryCompleted: document.getElementById('t4').checked,
            planCompleted: document.getElementById('t5').checked,
            goalCompleted: document.getElementById('t6').checked,
            smileCompleted: document.getElementById('t7').checked,
            confidenceCompleted: document.getElementById('t8').checked,
            affirmationCompleted: document.getElementById('t9').checked,
            comments: document.getElementById('t-comm').value.trim()
        };

        // Вычисляем точное число выполненных задач из 9 перед отправкой в Google Sheets
        reportDraft.completedCoreTasksCount = computeCompletedTasksCount(reportDraft);

        const btn = document.getElementById('save-report-btn');
        if (btn) { btn.disabled = true; btn.innerText = 'Сохранение в базу данных...'; }

        const action = existing ? 'update_report' : 'add_report';
        const res = await postAPI({ action, report: reportDraft });

        if (res.status === 'success') {
            showToast(`Отчет сохранен (${reportDraft.completedCoreTasksCount} из 9 задач)!`);
            await syncAllData(true);
            switchTab('home');
        } else {
            if (btn) { btn.disabled = false; btn.innerText = 'ОТПРАВИТЬ ОТЧЕТ'; }
            showToast(res.message || 'Ошибка при сохранении отчета', true);
        }
    }

    // Автоматическое сжатие фото до ~35 КБ для соблюдения лимита ячейки Google Sheets
    function sendImg(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
            const img = new Image();
            img.onload = async () => {
                let w = img.width, h = img.height;
                const maxDim = 600;
                if (w > maxDim || h > maxDim) {
                    if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                    else { w = Math.round((w * maxDim) / h); h = maxDim; }
                }
                const canvas = document.createElement('canvas');
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                const b64 = canvas.toDataURL('image/jpeg', 0.68).split(',')[1];

                const otherUsers = state.users.filter(u => u.id !== state.currentUser.id);
                const recipientObj = state.chatTab === 'DIRECT_MESSAGES'
                    ? (state.users.find(u => u.id === state.chatRecipientId) || otherUsers[0])
                    : null;

                const msg = {
                    id: 'msg_' + Date.now(),
                    senderId: state.currentUser.id,
                    senderName: state.currentUser.name,
                    senderRole: state.currentUser.role,
                    messageType: state.chatTab === 'DIRECT_MESSAGES' ? 'DIRECT_MESSAGE' : 'CHAT',
                    text: '[B64]' + b64,
                    recipientId: recipientObj ? recipientObj.id : '',
                    recipientName: recipientObj ? recipientObj.name : '',
                    dateFormatted: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })
                };
                state.messages.push(msg);
                render();
                await postAPI({ action: 'send_message', message: msg });
                syncAllData(true);
            };
            img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
    }

    // ============================================================================
    const AUDIO_PROGRAMS = [
        { id: 'a1', name: '1. Альфа-волны концентрации (432 Гц)', freq: 432, beat: 10 },
        { id: 'a2', name: '2. Тета-медитация глубокого покоя (396 Гц)', freq: 396, beat: 6 },
        { id: 'a3', name: '3. Шум летнего дождя и релакс (256 Гц)', freq: 256, beat: 4 },
        { id: 'a4', name: '4. Тибетские поющие чаши (528 Гц)', freq: 528, beat: 8 },
        { id: 'a5', name: '5. Океанский бриз (174 Гц)', freq: 174, beat: 5 },
        { id: 'a6', name: '6. Частота восстановления сил (639 Гц)', freq: 639, beat: 7.8 }
    ];

    let _audioCtx = null;
    let _breathInterval = null;

    function stopRelaxAudio() {
        if (_audioCtx) {
            try { _audioCtx.close(); } catch (_) {}
            _audioCtx = null;
        }
        state.activeAudioId = null;
    }

    function toggleRelaxAudio(progId) {
        if (state.activeAudioId === progId) {
            stopRelaxAudio();
            render();
            return;
        }
        stopRelaxAudio();
        const prog = AUDIO_PROGRAMS.find(p => p.id === progId);
        if (!prog) return;

        try {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            _audioCtx = new Ctx();
            const master = _audioCtx.createGain();
            master.gain.value = 0.14;
            master.connect(_audioCtx.destination);

            const osc1 = _audioCtx.createOscillator();
            const osc2 = _audioCtx.createOscillator();
            osc1.type = 'sine';
            osc2.type = 'sine';
            osc1.frequency.value = prog.freq;
            osc2.frequency.value = prog.freq + prog.beat;

            osc1.connect(master);
            osc2.connect(master);
            osc1.start();
            osc2.start();

            state.activeAudioId = progId;
            render();
        } catch (e) {
            showToast('Не удалось запустить аудио', true);
        }
    }

    function renderRelaxation(c) {
        c.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2 style="font-size:22px; font-weight:800;">Расслабление и Дыхание</h2>

                                    <i class="fa-solid ${active ? 'fa-pause' : 'fa-play'}" style="color:var(--cyan);"></i>

                        }).join('')}

                <div class="card" style="text-align:center; display:flex; flex-direction:column; justify-content:space-between; padding:24px;">
                    <div>
                        <h3 style="font-size:17px; font-weight:800;"><i class="fa-solid fa-wind" style="color:var(--purple);"></i> Практика дыхания 4-4-4-4</h3>
                        <p style="color:var(--text-muted); font-size:12px; margin-top:4px;">4 сек вдох • 4 сек задержка • 4 сек выдох • 4 сек пауза</p>
                    </div>

                    <div class="breath-circle" id="breath-circle-box">
                        <div id="breath-timer-num" class="tabular-nums" style="font-size:34px; font-weight:800;">4</div>
                        <div id="breath-phase-txt" style="font-size:13px; color:var(--cyan); font-weight:700; margin-top:4px;">Готовы?</div>
                    </div>

                    <button class="btn btn-cyan btn-full" onclick="toggleBreathingPractice()" id="breath-btn">Запустить дыхание 4-4-4-4</button>
                </div>
            </div>
        `;
    }

    function toggleBreathingPractice() {
        if (_breathInterval) {
            clearInterval(_breathInterval);
            _breathInterval = null;
            const btn = document.getElementById('breath-btn');
            if (btn) btn.innerText = 'Запустить дыхание 4-4-4-4';
            return;
        }
        const phases = [
            { name: 'Вдох (4 сек)', scale: 'scale(1.12)', color: 'var(--cyan)' },
            { name: 'Задержка (4 сек)', scale: 'scale(1.12)', color: 'var(--gold)' },
            { name: 'Выдох (4 сек)', scale: 'scale(0.88)', color: 'var(--emerald)' },
            { name: 'Пауза (4 сек)', scale: 'scale(0.88)', color: 'var(--purple)' }
        ];
        let phaseIdx = 0;
        let sec = 4;

        const updateUI = () => {
            const box = document.getElementById('breath-circle-box');
            const num = document.getElementById('breath-timer-num');
            const txt = document.getElementById('breath-phase-txt');
            const btn = document.getElementById('breath-btn');
            if (!box || !num || !txt) {
                clearInterval(_breathInterval);
                _breathInterval = null;
                return;
            }
            btn.innerText = 'Остановить практику';
            num.innerText = sec;
            txt.innerText = phases[phaseIdx].name;
            box.style.transform = phases[phaseIdx].scale;
            box.style.borderColor = phases[phaseIdx].color;
        };

        updateUI();
        _breathInterval = setInterval(() => {
            sec--;
            if (sec < 1) {
                sec = 4;
                phaseIdx = (phaseIdx + 1) % 4;
            }
            updateUI();
        }, 1000);
    }

    // 7. ИСТОРИЯ ОТЧЕТОВ (УЧЕНИКАМ ДОСТУПНА ТОЛЬКО ИХ ЛИЧНАЯ ИСТОРИЯ)
    // ============================================================================
    function renderHistory(c) {
        const isMentor = state.currentUser.role === 'MENTOR';

        let filtered = state.reports;
        if (!isMentor) {
            // Ученик видит строго только свои отчеты
            filtered = filtered.filter(r => r.userId === state.currentUser.id);
        } else if (state.historyStudentFilter) {
            filtered = filtered.filter(r => r.userId === state.historyStudentFilter);
        }

        const todayStr = getLocalTodayStr();
        if (state.historyPeriodFilter === 'WEEK') {
            const d = new Date(); d.setDate(d.getDate() - 6);
            const cutoff = getLocalTodayStr(d);
            filtered = filtered.filter(r => r.date >= cutoff);
        } else if (state.historyPeriodFilter === 'MONTH') {
            const d = new Date(); d.setDate(d.getDate() - 29);
            const cutoff = getLocalTodayStr(d);
            filtered = filtered.filter(r => r.date >= cutoff);
        } else if (state.historyPeriodFilter === 'ALL') {
            if (state.startDate && state.endDate) {
                filtered = filtered.filter(r => r.date >= state.startDate && r.date <= state.endDate);
            }
        }

        filtered = [...filtered].sort((a, b) => b.date.localeCompare(a.date));

        let html = `
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2 style="font-size:22px; font-weight:800;">${isMentor ? 'История отчетов' : 'Моя история отчетов'}</h2>
                <button class="btn btn-surface" onclick="syncAllData(true)"><i class="fa-solid fa-rotate"></i></button>
            </div>
        `;

        if (isMentor) {
            html += `
                <div class="filter-bar">
                    <div class="filter-chip ${state.historyStudentFilter === null ? 'active' : ''}" onclick="setStudentFilter(null)">Все ученики</div>
                    ${state.users.filter(u => u.role === 'STUDENT').map(u => `
                        <div class="filter-chip ${state.historyStudentFilter === u.id ? 'active' : ''}" onclick="setStudentFilter('${u.id}')">${escapeHtml(u.name)}</div>
                    `).join('')}
                </div>
            `;
        }

        html += `
            <div class="filter-bar" style="margin-top:4px;">
                <div class="filter-chip ${state.historyPeriodFilter === 'WEEK' ? 'active' : ''}" onclick="setHistoryPeriod('WEEK')">Неделя</div>
                <div class="filter-chip ${state.historyPeriodFilter === 'MONTH' ? 'active' : ''}" onclick="setHistoryPeriod('MONTH')">Месяц</div>
                <div class="filter-chip ${state.historyPeriodFilter === 'ALL' ? 'active' : ''}" onclick="setHistoryPeriod('ALL')">Все (Период)</div>
            </div>
        `;

        if (state.historyPeriodFilter === 'ALL') {
            html += `
                <div class="card" style="padding:14px;">
                    <div style="color:var(--text-muted); font-size:12px; margin-bottom:8px;">Выберите период (От — До):</div>
                    <div class="grid-2">
                        <div>
                            <label style="font-size:11px; color:var(--text-muted);">От:</label>
                            <input type="date" value="${state.startDate}" onchange="setStartDate(this.value)">
                        </div>
                        <div>
                            <label style="font-size:11px; color:var(--text-muted);">До:</label>
                            <input type="date" value="${state.endDate}" onchange="setEndDate(this.value)">
                        </div>
                    </div>
                </div>
            `;
        }

        html += `<div style="display:flex; flex-direction:column; gap:12px;">`;

        if (filtered.length === 0) {
            html += `<div class="card" style="text-align:center; color:var(--text-muted); padding:30px;">Отчетов не найдено<br><span style="font-size:12px;">Попробуйте изменить фильтр или период</span></div>`;
        } else {
            filtered.forEach(r => {
                const cnt = r.completedCoreTasksCount || 0;
                html += `
                    <div class="card" style="display:flex; flex-direction:column; gap:10px;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <div class="tabular-nums" style="font-weight:800; font-size:16px;">${escapeHtml(r.date)}</div>
                                <div style="color:var(--cyan); font-size:13px; font-weight:600;">${escapeHtml(r.userName)}</div>
                            </div>
                            <span class="role-tag role-student tabular-nums" style="font-size:12px; padding:6px 10px;">
                                ${cnt} из 9 (${Math.round((cnt / 9) * 100)}%)
                            </span>
                        </div>
                        <div style="font-size:12px; color:var(--text-muted); display:flex; flex-wrap:wrap; gap:12px;">
                            <span>Физ. нагрузка: <b style="color:var(--text-white);">${escapeHtml(r.physicalExerciseMin)} мин</b></span>
                            <span>Расслабление: <b style="color:var(--text-white);">${escapeHtml(r.relaxationMin)} мин</b></span>
                            ${r.readingBookDetails ? `<span>Книга: <b style="color:var(--text-white);">${escapeHtml(r.readingBookDetails)}</b></span>` : ''}
                        </div>
                        ${r.comments ? `<div style="color:var(--text-white); font-size:13px; background:var(--surface-dark); padding:10px 12px; border-radius:10px;">💬 ${escapeHtml(r.comments)}</div>` : ''}
                        <div style="display:flex; justify-content:flex-end; gap:8px;">
                            <button class="btn btn-surface btn-sm" onclick="inspectReportModal('${r.id}')"><i class="fa-solid fa-eye"></i> Подробнее</button>
                            ${isMentor ? `<button class="btn btn-surface btn-sm" style="color:var(--danger);" onclick="deleteReport('${r.id}')"><i class="fa-solid fa-trash"></i> Удалить</button>` : ''}
                        </div>
                    </div>
                `;
            });
        }

        html += `</div>`;
        c.innerHTML = html;
    }

    function setHistoryPeriod(p) { state.historyPeriodFilter = p; render(); }
    function setStudentFilter(id) { state.historyStudentFilter = id; render(); }
    function setStartDate(d) { state.startDate = d; render(); }
    function setEndDate(d) { state.endDate = d; render(); }

    async function deleteReport(id) {
        if (!confirm('Удалить этот отчет из базы данных?')) return;
        state.reports = state.reports.filter(r => r.id !== id);
        render();
        const res = await postAPI({ action: 'delete_report', reportId: id });
        if (res.status === 'success') {
            showToast('Отчет удален');
            await syncAllData(true);
        }
    }

    // ============================================================================
    // 8. ПРОФИЛЬ ПОЛЬЗОВАТЕЛЯ
    // ============================================================================
    function renderProfile(c) {
        const u = state.currentUser;
        const isMentor = u.role === 'MENTOR';
        const myReportsCount = isMentor ? state.reports.length : state.reports.filter(r => r.userId === u.id).length;

        c.innerHTML = `
            <h2 style="font-size:22px; font-weight:800;">Профиль пользователя</h2>
            <div class="card" style="display:flex; flex-direction:column; align-items:center; gap:14px; padding:30px; max-width:500px; margin:0 auto; width:100%;">
                <div class="avatar-circle" style="width:80px; height:80px; font-size:36px;">
                    <i class="fa-solid fa-user"></i>
                </div>
                <h3 style="font-size:20px; font-weight:800;">${escapeHtml(u.name)}</h3>
                <span class="role-tag ${isMentor ? 'role-mentor' : 'role-student'}" style="font-size:13px; padding:6px 14px;">
                    ${isMentor ? 'Наставник' : 'Ученик'}
                </span>
                <p style="color:var(--text-muted); font-size:14px;">Логин: <b>${escapeHtml(u.login)}</b></p>
                <p class="tabular-nums" style="color:var(--cyan); font-size:13px; font-weight:700;">
                    ${isMentor ? `Всего отчетов в базе: ${myReportsCount}` : `Моих отчетов: ${myReportsCount} • Стрик: 🔥 ${u.streakDays || 0} дн.`}
                </p>
                <button class="btn btn-danger btn-full" style="margin-top:16px; padding:14px; font-size:15px;" onclick="logout()">ВЫЙТИ ИЗ АККАУНТА</button>
            </div>
        `;
    }

    // ============================================================================
    // ЗАПУСК ПРИЛОЖЕНИЯ
    // ============================================================================
    if (state.currentUser) {
        render();
        syncAllData(false);
    } else {
        render();
    }
</script>

</body>
</html>
